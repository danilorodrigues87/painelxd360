<script src="{{URL}}/resources/js/ajax.js?v=20260817cx"></script>

<script>
	function ativarAbaCaixa(filtro) {
		$('#fil-hoje, #fil-semana, #fil-mes, #fil-atraso').removeClass('active');
		if (filtro === 'semana') {
			$('#fil-semana').addClass('active');
		} else if (filtro === 'mes') {
			$('#fil-mes').addClass('active');
		} else if (filtro === 'atraso') {
			$('#fil-atraso').addClass('active');
		} else {
			$('#fil-hoje').addClass('active');
		}
	}

	function listar(filtro, page) {
		page = page || 1;
		if (arguments.length >= 1) {
			_ultimoFiltroLista = filtro;
		}
		var filtroEnvio = (_ultimoFiltroLista !== null && _ultimoFiltroLista !== undefined && _ultimoFiltroLista !== '')
			? _ultimoFiltroLista
			: (filtro || 'hoje');

		$.ajax({
			url: url_base + listagem,
			method: 'post',
			data: { filtro: filtroEnvio, page: page },
			dataType: 'json',
			success: function(result) {
				if (!result || typeof result.itens === 'undefined') {
					$('#listar').html('<div class="alert alert-warning m-3">Não foi possível carregar a lista.</div>');
					return;
				}
				$('#listar').html(result.itens);
				$('#pagination').html(result.pagination || '');
				ativarAbaCaixa(filtroEnvio);
			},
			error: function() {
				$('#listar').html('<div class="alert alert-danger m-3">Erro ao carregar saídas.</div>');
			}
		});
	}

	$(document).ready(function() {
		listar('hoje', 1);
	});
</script>
