<h1 class="mt-4">Cadastrar candidato</h1>
<ol class="breadcrumb mb-4">
  <li class="breadcrumb-item"><a href="{{URL}}/painel/conect">Conecta Jovem</a></li>
  <li class="breadcrumb-item active">Novo candidato</li>
</ol>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <form method="post" action="{{save_url}}" id="form-candidato-conect">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nome *</label>
          <input type="text" name="nome" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Data de nascimento *</label>
          <input type="date" name="nascimento" id="nascimento-candidato" class="form-control" required>
          <div class="form-text">Participação a partir de 12 anos.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">WhatsApp</label>
          <input type="text" name="whatsapp" class="form-control" placeholder="11999999999">
        </div>
        <div class="col-md-6">
          <label class="form-label">E-mail (opcional — cria acesso ao portal)</label>
          <input type="email" name="email" class="form-control">
        </div>
        <div class="col-12 d-none" id="bloco-responsavel-conect">
          <label class="form-label">Nome do responsável legal *</label>
          <input type="text" name="responsavel_nome" id="responsavel-nome-conect" class="form-control">
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" name="responsavel_consentimento" id="resp-consent-conect" value="1">
            <label class="form-check-label" for="resp-consent-conect">
              Declaro ser o responsável legal ou possuir autorização para este cadastro.
            </label>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Resumo / objetivo</label>
          <textarea name="resumo" class="form-control" rows="3"></textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar candidato</button>
        <a href="{{URL}}/painel/conect" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
<script>
(function(){
  var input = document.getElementById('nascimento-candidato');
  var bloco = document.getElementById('bloco-responsavel-conect');
  if (!input || !bloco) return;
  var hoje = new Date();
  var max = new Date(hoje.getFullYear() - 12, hoje.getMonth(), hoje.getDate());
  input.max = max.toISOString().slice(0, 10);
  function toggleResp(){
    if (!input.value) { bloco.classList.add('d-none'); return; }
    var parts = input.value.split('-');
    var dn = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    var idade = hoje.getFullYear() - dn.getFullYear();
    var m = hoje.getMonth() - dn.getMonth();
    if (m < 0 || (m === 0 && hoje.getDate() < dn.getDate())) idade--;
    if (idade < 18) {
      bloco.classList.remove('d-none');
      document.getElementById('responsavel-nome-conect').required = true;
      document.getElementById('resp-consent-conect').required = true;
    } else {
      bloco.classList.add('d-none');
      document.getElementById('responsavel-nome-conect').required = false;
      document.getElementById('resp-consent-conect').required = false;
    }
  }
  input.addEventListener('change', toggleResp);
})();
</script>
