<h1 class="mt-4">Alunos online</h1>
<ol class="breadcrumb mb-4">
	<li class="breadcrumb-item active">Quem está no portal agora e em qual aula</li>
</ol>

<div class="d-flex flex-wrap gap-2 align-items-center mb-3">
	<span class="badge bg-success fs-6" id="badge-total">0 online</span>
	<span class="badge bg-primary" id="badge-aula">0 em aula</span>
	<span class="badge bg-secondary" id="badge-nav">0 navegando</span>
	<span class="text-muted small ms-auto" id="online-atualizado">—</span>
	<button type="button" class="btn btn-sm btn-outline-secondary" id="btn-refresh-online">
		<i class="fas fa-sync-alt"></i> Atualizar
	</button>
</div>

<div id="alert-online" class="alert alert-danger d-none"></div>

<div class="card shadow-sm">
	<div class="card-body p-0">
		<div class="table-responsive">
			<table class="table table-hover mb-0 align-middle">
				<thead class="table-light">
					<tr>
						<th>Aluno</th>
						<th>Status</th>
						<th>Onde</th>
						<th class="text-end">Último ping</th>
					</tr>
				</thead>
				<tbody id="lista-alunos-online">
					<tr><td colspan="4" class="text-center text-muted py-4">Carregando...</td></tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

<script>
(function(){
	var endpoint = url_base + 'painel/ead/alunos-online';

	function esc(s){
		return String(s == null ? '' : s)
			.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
			.replace(/"/g,'&quot;');
	}
	function fmtAtras(sec){
		sec = parseInt(sec, 10) || 0;
		if (sec < 5) return 'agora';
		if (sec < 60) return 'há ' + sec + 's';
		return 'há ' + Math.floor(sec / 60) + ' min';
	}
	function iniciais(nome){
		var parts = String(nome || '').trim().split(/\s+/).filter(Boolean);
		if (!parts.length) return '?';
		if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
		return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
	}
	function avatarHtml(a){
		if (!a.fotoUrl) {
			return '<span class="rounded-circle bg-light text-secondary border d-inline-flex align-items-center justify-content-center me-2 flex-shrink-0" style="width:36px;height:36px;font-size:12px;font-weight:600" title="Sem foto">'+esc(iniciais(a.nome))+'</span>';
		}
		return '<img src="'+esc(a.fotoUrl)+'" alt="" class="rounded-circle me-2 flex-shrink-0" width="36" height="36" style="object-fit:cover" onerror="this.onerror=null;this.src=\''+esc(url_base)+'resources/assets/img/icons/client.png\'">';
	}
	function showErr(msg){
		$('#alert-online').removeClass('d-none').text(msg || 'Falha ao listar.');
	}
	function hideErr(){
		$('#alert-online').addClass('d-none').text('');
	}
	function render(lista){
		var $tb = $('#lista-alunos-online');
		if (!lista || !lista.length) {
			$tb.html('<tr><td colspan="4" class="text-center text-muted py-4">Nenhum aluno online no momento.</td></tr>');
			return;
		}
		var html = '';
		lista.forEach(function(a){
			var badge = a.status === 'em_aula'
				? '<span class="badge bg-primary">Em aula</span>'
				: '<span class="badge bg-secondary">Navegando</span>';
			html += '<tr>'
				+ '<td><div class="d-flex align-items-center">'+avatarHtml(a)+'<div><div class="fw-semibold">'+esc(a.nome)+'</div>'
				+ '<a class="small text-muted" href="'+url_base+'painel/ead/aluno/'+a.id+'">Ver progresso</a></div></div></td>'
				+ '<td>'+badge+'</td>'
				+ '<td>'+esc(a.detalhe||'—')+'</td>'
				+ '<td class="text-end text-muted small">'+esc(fmtAtras(a.segundosAtras))+'</td>'
				+ '</tr>';
		});
		$tb.html(html);
	}
	function carregar(){
		hideErr();
		$.ajax({
			url: endpoint,
			method: 'POST',
			data: { acao: 'listar' },
			dataType: 'json'
		}).done(function(res){
			if (!res || !res.success) {
				showErr((res && res.message) || 'Falha ao listar.');
				$('#lista-alunos-online').html('<tr><td colspan="4" class="text-center text-muted py-4">—</td></tr>');
				return;
			}
			$('#badge-total').text((res.total||0) + ' online');
			$('#badge-aula').text((res.em_aula||0) + ' em aula');
			$('#badge-nav').text((res.navegando||0) + ' navegando');
			$('#online-atualizado').text('Atualizado às ' + new Date().toLocaleTimeString());
			render(res.alunos || []);
		}).fail(function(xhr){
			var snip = (xhr.responseText || '').replace(/\s+/g,' ').slice(0,180);
			showErr('HTTP ' + xhr.status + (snip ? ' — ' + snip : ' (sem resposta). Confira se o arquivo routes/admin/ead.php foi atualizado no servidor.'));
			$('#lista-alunos-online').html('<tr><td colspan="4" class="text-center text-danger py-4">Falha ao carregar.</td></tr>');
		});
	}
	$('#btn-refresh-online').on('click', carregar);
	carregar();
	setInterval(carregar, 15000);
})();
</script>
