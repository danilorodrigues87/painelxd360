<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="XD360" />
  <title>{{title}}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('xd360-theme');
        document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
  <link rel="icon" href="{{favicon_url}}" type="image/png">
  <link rel="apple-touch-icon" href="{{pwa_apple_icon_url}}">
  <link rel="manifest" href="{{URL}}/manifest.webmanifest">
  {{onesignal_head}}
  <link href="{{URL}}/resources/css/styles.css" rel="stylesheet" />
  <link href="{{URL}}/resources/css/panel-theme.css?v=20260901a" rel="stylesheet" />
  <link href="{{URL}}/resources/css/xd360-brand.css?v=20260926i" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.css">
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="{{URL}}/resources/js/url-base.js?v=20260716m"></script>
  <script src="{{URL}}/resources/js/anti-autofill.js?v=20260729e"></script>
</head>
<body class="sb-nav-fixed">
  {{banner_impersonate}}
  <nav class="sb-topnav navbar navbar-expand navbar-dark xd360-navbar">
    <a class="navbar-brand ps-3 d-flex align-items-center gap-2" href="{{URL}}/painel">
      <img class="xd360-logo-on-light" src="{{logo_light_url}}" alt="XD360">
      <img class="xd360-logo-on-dark" src="{{logo_dark_url}}" alt="">
    </a>
    <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
    <div class="navbar-brand d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0 ps-3"></div>
    <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
      <li class="nav-item dropdown d-none" id="nav-notif-wrap">
        <a class="nav-link position-relative py-2" id="navNotificacoes" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" title="Notificações">
          <i class="fas fa-bell fa-fw"></i>
          <span class="staff-notif-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="staff-notif-badge">0</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end staff-notif-menu p-0" aria-labelledby="navNotificacoes" data-bs-popper-config='{"strategy":"fixed","modifiers":[{"name":"preventOverflow","options":{"padding":8,"altAxis":true}}]}'>
          <li class="px-3 py-2 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2 staff-notif-header">
            <strong class="small mb-0">Notificações</strong>
            <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none staff-notif-marcar-btn" id="staff-notif-marcar-todas">Marcar todas</button>
          </li>
          <li id="staff-notif-lista" class="staff-notif-lista">
            <div class="px-3 py-3 text-muted small">Carregando…</div>
          </li>
        </ul>
      </li>
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle d-flex align-items-center" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
          <img id="nav-user-foto" src="{{foto_url}}" alt="" width="28" height="28" class="rounded-circle me-1" style="object-fit:cover;border:1px solid rgba(255,255,255,.35);">
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
          <li><a class="dropdown-item" href="{{URL}}/painel/perfil"><i class="fa-regular fa-id-badge"></i> Perfil</a></li>
          <li><a class="dropdown-item" data-bs-toggle="modal" data-bs-target="#modalResetSenha" href="#"><i class="fa-solid fa-lock"></i> Mudar senha</a></li>
          <li><a class="dropdown-item" href="#" id="btn-toggle-theme"><i class="fa-regular fa-moon me-1"></i> Tema escuro</a></li>
          <li><a class="dropdown-item" href="#" id="pwa-install-menu"><i class="fa-solid fa-download me-1"></i> Instalar app</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item" href="{{URL}}/logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</a></li>
        </ul>
      </li>
    </ul>
  </nav>
  <div id="layoutSidenav">
    {{menu}}
    <div id="layoutSidenav_content">
      <main>
        <div class="container-fluid px-4">
          {{content}}
        </div>
      </main>
      <footer class="py-4 xd360-footer text-white mt-auto">
        <div class="container-fluid px-4">
          <div class="small text-muted d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <span>&copy; XD360</span>
            <span>Desenvolvido por <a class="text-muted text-decoration-none" target="_blank" rel="noopener noreferrer" href="https://xdtec.com.br">XDTEC</a></span>
          </div>
        </div>
      </footer>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{URL}}/resources/js/sidebarToggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="{{URL}}/resources/js/script.js?v=20260731h"></script>
  <script src="{{URL}}/resources/js/jquery.mask.js"></script>
  <script src="{{URL}}/resources/js/js_mascara.js"></script>
  <script src="{{URL}}/resources/js/campanha-heartbeat.js?v=20260717a"></script>
  <script src="{{URL}}/resources/js/panel-theme.js?v=20260926i"></script>
  <script src="{{URL}}/resources/js/staff-notificacoes.js?v=20260819c"></script>
  <script src="{{URL}}/resources/js/onesignal-staff.js?v=20260827a"></script>
  <script src="{{URL}}/resources/js/pwa-install.js?v=20260819a"></script>
  <script>
    let estadoCidades = 'painel/get_cidades';
    let resetarSenha = 'reset_senha';
  </script>
  <div class="modal fade" id="modalResetSenha" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal" id="btn-fechar" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <div id="response"></div>
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="form-floating mb-3 mb-md-0">
                <input class="form-control" name="senha1" id="senha1" type="password" placeholder="Informe sua senha" required />
                <label for="inputPassword">Senha</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3 mb-md-0">
                <input class="form-control" name="senha2" id="senha2" type="password" placeholder="Confirme sua senha" required />
                <label for="inputPasswordConfirm">Confirme sua Senha</label>
              </div>
            </div>
          </div>
          <div class="mt-4 mb-0">
            <div class="d-grid">
              <button type="button" onclick="resetSenha()" class="btn btn-primary">Confirmar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="pwa-install-banner" class="pwa-install-banner d-none" role="region" aria-label="Instalar aplicativo">
    <div class="pwa-install-inner">
      <div class="small">
        <strong>Instalar XD360</strong>
        <span class="d-none d-sm-inline text-muted"> — acesso rápido no celular</span>
      </div>
      <div class="d-flex gap-2 flex-shrink-0">
        <button type="button" class="btn btn-sm btn-light" id="pwa-install-btn">Instalar</button>
        <button type="button" class="btn btn-sm btn-outline-light" id="pwa-install-close" aria-label="Fechar">&times;</button>
      </div>
    </div>
  </div>
</body>
</html>
