<nav aria-label="breadcrumb">
	<ol class="breadcrumb">
		<li class="breadcrumb-item"><a href="{{URL}}/master/conect">Conecta Jovem</a></li>
		<li class="breadcrumb-item active">Blog</li>
	</ol>
</nav>

<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
	<h1 class="h4 mb-0">Blog Conecta Jovem</h1>
	<a href="{{URL}}/master/conect-blog/editar/0" class="btn btn-primary btn-sm">
		<i class="fas fa-plus me-1"></i> Novo artigo
	</a>
</div>

<p class="text-muted small">

	Total: {{total_posts}}.
</p>

	<li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-posts" type="button">Artigos</button></li>

			</table>
		</div>
	</div>
	<div class="tab-pane fade" id="tab-comentarios">
		<div class="table-responsive">
			<table class="table table-sm table-hover align-middle">
				<thead><tr><th>Autor</th><th>Artigo</th><th>Comentário</th><th>Data</th><th></th></tr></thead>
